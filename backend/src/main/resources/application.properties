spring.application.name=admin-portal
server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/qhxpro}
spring.datasource.username=${DATABASE_USERNAME:qhxpro}
spring.datasource.password=${DATABASE_PASSWORD:qhxpro}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.security.account.username=superadmin
app.security.account.password=${SUPERADMIN_PASSWORD:}
