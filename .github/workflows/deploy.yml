name: Build and Deploy to Droplet

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Copy JAR to deployment directory
        run: |
          cp target/*.jar /opt/springboot-app/app.jar
          chmod +x /opt/springboot-app/app.jar

      - name: Stop previous application
        run: |
          sudo systemctl stop springboot-app || true

      - name: Start application with systemd
        run: sudo systemctl start springboot-app

      - name: Verify application is running
        run: |
          sleep 5
          sudo systemctl status springboot-app

      - name: Deployment successful
        run: echo "✓ Application deployed successfully"
